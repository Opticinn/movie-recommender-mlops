name: 🤖 Simulate Traffic Bot

on:
  schedule:
    # Berjalan setiap 2 jam sekali pada menit ke-15 (otomatis tanpa henti)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Mengizinkan eksekusi manual via tombol di GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Traffic Bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Kita set GITHUB_ACTIONS=true agar bot Telegram TIDAK spam HP-mu saat bot ini jalan
          GITHUB_ACTIONS: "true" 
        run: |
          python scripts/simulate_traffic.py